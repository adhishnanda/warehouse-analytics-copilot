table: fact_orders
description: >
  Order line items — the central fact table. Each order can have multiple
  lines, one per product/supplier combination on that order, so order-level
  figures (e.g. total order value) require aggregating up from this grain.
grain: One row per (order_key, line_number)
columns:
  order_key:
    type: BIGINT
    description: Identifier of the order this line belongs to. Not unique alone — combine with line_number for the row key.
  line_number:
    type: INTEGER
    description: Line number within the order, starting at 1.
  customer_key:
    type: BIGINT
    description: Foreign key to dim_customer.customer_key. Set at the order level, so it repeats across every line of the same order.
  supplier_key:
    type: BIGINT
    description: Foreign key to dim_supplier.supplier_key. Set per line — different lines of the same order can have different suppliers.
  product_key:
    type: BIGINT
    description: Foreign key to dim_product.product_key.
  order_date_key:
    type: INTEGER
    description: Foreign key to dim_date.date_key — the date the order was placed.
  ship_date_key:
    type: INTEGER
    description: Foreign key to dim_date.date_key — the date this specific line item shipped.
  order_status:
    type: VARCHAR
    description: >
      Order header status: "O" (open), "F" (finished/filled), "P" (partially
      filled). Set at the order level, repeats across lines.
  order_priority:
    type: VARCHAR
    description: >
      Order priority code, e.g. "1-URGENT", "3-MEDIUM". Set at the order level.
  ship_mode:
    type: VARCHAR
    description: Shipping method for this line, e.g. "AIR", "TRUCK", "MAIL".
  return_flag:
    type: VARCHAR
    description: >
      Synthetic accounting flag generated by the TPC-H data generator ("A",
      "N", "R"), not a verified real-world returns indicator. Do not build
      a "return rate" business metric on this column without confirming its
      exact semantics first.
  line_status:
    type: VARCHAR
    description: Line fulfilment status, "O" (open) or "F" (filled).
  quantity:
    type: DECIMAL
    description: Quantity of product ordered on this line.
  extended_price:
    type: DECIMAL
    description: List price for this line before any discount, i.e. quantity x unit price.
  discount:
    type: DECIMAL
    description: Discount applied to this line, as a fraction (e.g. 0.05 = 5% off).
  tax:
    type: DECIMAL
    description: Tax rate applied to this line, as a fraction. Not deducted in net_revenue.
  net_revenue:
    type: DECIMAL
    description: >
      Precomputed as extended_price * (1 - discount). This is the standard
      TPC-H revenue measure — use this column for revenue questions rather
      than recomputing from extended_price and discount, and rather than
      using extended_price alone (which ignores discount).
joins:
  - column: customer_key
    references: dim_customer.customer_key
  - column: supplier_key
    references: dim_supplier.supplier_key
  - column: product_key
    references: dim_product.product_key
  - column: order_date_key
    references: dim_date.date_key
  - column: ship_date_key
    references: dim_date.date_key
caveats:
  - >
    This table is at line-item grain, not order grain. Counting rows
    answers "how many order lines", not "how many orders" — use
    COUNT(DISTINCT order_key) for order counts.
  - >
    net_revenue already applies the line discount; do not multiply by
    (1 - discount) again.
  - >
    tax is not deducted anywhere in this table. There is no net-of-tax
    revenue column.
