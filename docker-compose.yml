# Single consolidated compose file for the whole stack: warehouse
# seeding, the FastAPI backend (which also serves the built React SPA -
# both the Ask and Monitoring pages live there now, see src/app/api.py),
# and Kestra orchestration (the Day 19 nightly refresh flow).
#
# Both app services share one image (built once, tagged explicitly so
# the Kestra flow's containerImage reference matches) and one named
# volume (warehouse_data) at /app/data, so a warehouse/index refresh —
# whether from `seed` or from Kestra's nightly flow — is immediately
# visible to api without a restart.

services:
  seed:
    build: .
    image: warehouse-analytics-copilot:latest
    volumes:
      - warehouse_data:/app/data
    environment:
      - DUCKDB_PATH=/app/data/warehouse.duckdb
      - TPCH_SCALE_FACTOR=${TPCH_SCALE_FACTOR:-0.1}
    command: ["python", "scripts/seed_and_index.py"]

  api:
    build: .
    image: warehouse-analytics-copilot:latest
    volumes:
      - warehouse_data:/app/data
    environment:
      - DUCKDB_PATH=/app/data/warehouse.duckdb
      - TRACE_LOG_PATH=/app/data/telemetry/traces.jsonl
      - TELEMETRY_DB_PATH=/app/data/telemetry.duckdb
      - AGENT_CHAT_BACKEND=${AGENT_CHAT_BACKEND:-ollama}
      # Deliberately not ${OLLAMA_BASE_URL:-...}: compose auto-loads the
      # repo's .env for variable substitution, and that file's
      # OLLAMA_BASE_URL is host-side (http://localhost:11434, for `uv
      # run` on the host) - interpolating it here would silently defeat
      # the container-appropriate default below. host.docker.internal
      # reaches the host machine from inside a container (Docker
      # Desktop); Ollama itself is not containerized, since it's meant
      # to run once on the host and be shared by every session.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Not interpolated here to avoid printing it in `docker compose
      # config` output. To use the paid AGENT_CHAT_BACKEND=openai path,
      # pass it at runtime instead: `docker compose run -e
      # OPENAI_API_KEY=... api ...`.
    command: ["uvicorn", "src.app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  # Kestra's own metadata store (executions, flows, triggers) - the
  # standard backend for `server standalone` (unlike the embedded H2
  # `server local` mode used for Day 19's exploration, which doesn't
  # apply the full KESTRA_CONFIGURATION pipeline).
  kestra-db:
    image: postgres:15.18
    volumes:
      - kestra_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3.30
    # Runs as root so it can reach the mounted Docker socket - a known
    # Docker-Desktop-on-Windows permission quirk (see SESSION_LOG.md,
    # Day 19): the image's default non-root user gets a connection
    # "Permission denied" on /var/run/docker.sock otherwise.
    user: "root"
    command: server standalone
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_storage:/app/storage
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            # Kestra OSS made basic auth mandatory as of 0.24.0 - the
            # `enabled` flag is now ignored, and an unconfigured instance
            # instead serves a publicly-reachable first-run setup page
            # until credentials are submitted there. Setting them here
            # instead avoids that interactive step and keeps the instance
            # protected from the moment it starts (same local-orchestration-
            # credential pattern as kestra-db's Postgres password above -
            # not a secret protecting real data, this is a local dev UI).
            basic-auth:
              username: admin@kestra.io
              password: k3str4-admin
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    ports:
      - "8081:8080"
    depends_on:
      kestra-db:
        condition: service_healthy

volumes:
  warehouse_data:
  kestra_db_data:
  kestra_storage:
